name: K4Connect
description: 'K4Connect is a Morrisville, North Carolina technology company serving the senior living
  industry, backed by Sierra Ventures. Its patented FusionOS integration and data platform provides
  two-way ("One-to-Many") interoperability that shares the who, what and when of a community between
  every integrated system, connecting 50+ leading applications, devices and services. On top of FusionOS
  sits K4Community, an enterprise engagement suite of interconnected modules: Team Hub for staff, the
  Plus App for residents, Voice (Amazon Alexa), K4TV infotainment, Digital Signage, and smart-home
  Resident Check-In. K4Connect operates a partner-led integration model rather than a public self-serve
  developer API; integrations are built and coordinated through FusionOS.'
